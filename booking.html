<style>
/* 🔥 Background */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: url("{{ url_for('static', filename='table-book.jpg') }}");
    background-size: cover;
    background-position: center;
}

/* 🔥 Overlay */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    top: 0;
    left: 0;
    z-index: -1;
}

/* 🔥 Glass Card */
.booking-card {
    width: 350px;
    margin: 50px auto;
    padding: 25px;
    border-radius: 15px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
    color: white;
    animation: fadeIn 1s ease-in-out;
}

/* Inputs */
.booking-card input, 
.booking-card select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* Button */
.book-btn {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.book-btn:hover {
    background: #e63946;
    transform: scale(1.05);
}

/* Animation */
@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}
</style>


<div class="booking-card">

    <h3 style="text-align:center;">🍽️ Book Your Table</h3>

    <form action="/book" method="POST">

        <!-- Hidden restaurant -->
        <input type="hidden" name="restaurant" value="{{r['Restaurant Name']}}">

        <!-- Name -->
        <input type="text" name="name" placeholder="Your Name" required>

        <!-- Phone -->
        <input type="tel" name="phone" placeholder="Phone Number" required>

        <!-- Date -->
        <input type="date" name="date" required>

        <!-- Time -->
        <input type="time" name="time" required>

        <!-- Number of People -->
        <input type="number" name="people" placeholder="No. of People" min="1" required>

        <!-- Table Type -->
        <select name="table_type">
            <option value="">Select Table Type</option>
            <option>Normal</option>
            <option>Family</option>
            <option>Couple</option>
            <option>Outdoor</option>
            <option>AC Hall</option>
        </select>

        <!-- Special Request -->
        <input type="text" name="request" placeholder="Special Request (Optional)">

        <button class="book-btn">✅ Book Table</button>
    </form>

</div>
